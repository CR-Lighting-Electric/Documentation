<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Schematic of a threaded conduit nipple</title>
<desc>Side-view line diagram of a conduit nipple, showing male threading on both ends, an unthreaded center shoulder present on longer nipples, and a locknut threaded onto one end.</desc>

<rect x="100" y="150" width="480" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<line x1="108" y1="150" x2="108" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="120" y1="150" x2="120" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="132" y1="150" x2="132" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="144" y1="150" x2="144" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="156" y1="150" x2="156" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="168" y1="150" x2="168" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>

<line x1="508" y1="150" x2="508" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="520" y1="150" x2="520" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="532" y1="150" x2="532" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="544" y1="150" x2="544" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="556" y1="150" x2="556" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="568" y1="150" x2="568" y2="174" stroke="#B4B2A9" stroke-width="0.5"/>

<polygon points="524,162 532,150 548,150 556,162 548,174 532,174" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>

<path d="M140,150 L140,40 L550,40" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3,3"/>
<circle cx="140" cy="150" r="2" fill="#5F5E5A"/>
<path d="M340,150 L340,75 L550,75" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3,3"/>

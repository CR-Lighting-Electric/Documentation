<text x="560" y="44" font-family="sans-serif" font-size="12" fill="#2C2C2A">Threaded end</text>
<text x="560" y="79" font-family="sans-serif" font-size="12" fill="#2C2C2A">Shoulder</text>
<text x="560" y="234" font-family="sans-serif" font-size="12" fill="#2C2C2A">Locknut</text>
</svg>

<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Schematic of an EMT set-screw coupling</title>
<desc>Side-view line diagram showing two lengths of EMT conduit joined by a set-screw coupling, with the coupling body, internal center stop, and set screws at each end labeled.</desc>

<!-- Left EMT conduit stub -->
<rect x="30" y="168" width="100" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Coupling body -->
<rect x="130" y="150" width="220" height="62" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Internal center stop -->
<line x1="240" y1="150" x2="240" y2="212" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="2,3"/>

<!-- Right EMT conduit stub -->
<rect x="350" y="168" width="100" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Set screws (each end) -->
<rect x="175" y="128" width="20" height="24" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<line x1="178" y1="140" x2="192" y2="140" stroke="#2C2C2A" stroke-width="1.5" opacity="0.5"/>
<rect x="305" y="128" width="20" height="24" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<line x1="308" y1="140" x2="322" y2="140" stroke="#2C2C2A" stroke-width="1.5" opacity="0.5"/>

<!-- Leader lines -->
<path d="M240,150 L240,95 L450,95" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3,3"/>
<circle cx="240" cy="150" r="2" fill="#5F5E5A"/>
<path d="M315,128 L315,70 L450,70" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3,3"/>
<circle cx="315" cy="128" r="2" fill="#5F5E5A"/>
<path d="M240,181 L240,250 L450,250" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3,3"/>
<circle cx="240" cy="181" r="2" fill="#5F5E5A"/>

<!-- Labels -->
<text x="460" y="74" font-family="sans-serif" font-size="12" fill="#2C2C2A">Set screw (each end)</text>
<text x="460" y="99" font-family="sans-serif" font-size="12" fill="#2C2C2A">Coupling body</text>
<text x="460" y="254" font-family="sans-serif" font-size="12" fill="#2C2C2A">Center stop</text>
</svg>
